<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>เลือกเวอร์ชันคลิป / Choose your version</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,500;9..144,600&family=Noto+Serif+Thai:wght@300;500;600&family=Inter:wght@400;500&family=Noto+Sans+Thai:wght@400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg: #121110;
            --surface: #1a1815;
            --line: rgba(242, 239, 231, 0.14);
            --line-strong: rgba(242, 239, 231, 0.3);
            --text: #f2efe7;
            --text-dim: #9c968a;
            --gold: #d4a73d;
            --gold-dim: rgba(212, 167, 61, 0.5);
            --en: #7fa6b8;
            --th: #d4a73d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            height: 100%;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', 'Noto Sans Thai', sans-serif;
            overflow: hidden;
        }

        .stage {
            position: relative;
            height: 100vh;
            height: 100dvh;
            width: 100vw;
        }

        /* ---------- Selector screen ---------- */
        .selector {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            transition: opacity 0.6s ease, filter 0.6s ease;
        }

        .selector.hidden {
            opacity: 0;
            filter: blur(6px);
            pointer-events: none;
        }

        .header {
            text-align: center;
            padding: clamp(4.5rem, 12vh, 5.5rem) clamp(1rem, 4vw, 2rem) clamp(0.75rem, 2.5vh, 2rem);
        }

        .eyebrow {
            font-family: 'Inter', sans-serif;
            font-size: clamp(9px, 2vw, 11px);
            letter-spacing: 0.28em;
            text-transform: uppercase;
            color: var(--text-dim);
        }

        .title-th {
            font-family: 'Noto Serif Thai', serif;
            font-weight: 500;
            font-size: clamp(1.25rem, 5vw, 2.4rem);
            margin-top: 0.5rem;
        }

        .title-en {
            font-family: 'Fraunces', serif;
            font-weight: 300;
            font-style: italic;
            font-size: clamp(0.85rem, 2.6vw, 1.25rem);
            color: var(--text-dim);
            margin-top: 0.3rem;
        }

        .panels {
            flex: 1;
            display: flex;
            position: relative;
            min-height: 0;
        }

        .panel {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: var(--surface);
            overflow: hidden;
            transition: flex 0.5s cubic-bezier(.2, .7, .2, 1);
        }

        .panel::before {
            content: "";
            position: absolute;
            inset: 0;
            background: radial-gradient(circle at 50% 45%, rgba(242, 239, 231, 0.05), transparent 60%);
            opacity: 0;
            transition: opacity 0.4s ease;
        }

        .panel:hover::before {
            opacity: 1;
        }

        .panel:hover {
            flex: 1.12;
        }

        .panel:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: -6px;
        }

        .panel-inner {
            position: relative;
            text-align: center;
            padding: 2rem;
        }

        .lang-mark {
            font-family: 'Inter', sans-serif;
            font-size: 12px;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--text-dim);
            display: block;
            margin-bottom: 1rem;
            transition: color 0.3s ease;
        }

        .panel-th .lang-mark {
            color: var(--th);
            opacity: 0.75;
        }

        .panel-en .lang-mark {
            color: var(--en);
            opacity: 0.75;
        }

        .lang-name {
            font-weight: 500;
            line-height: 1;
            transition: transform 0.4s cubic-bezier(.2, .7, .2, 1), letter-spacing 0.4s ease;
        }

        .panel-th .lang-name {
            font-family: 'Noto Serif Thai', serif;
            font-size: clamp(2.6rem, 8vw, 4.6rem);
        }

        .panel-en .lang-name {
            font-family: 'Fraunces', serif;
            font-size: clamp(2.6rem, 8vw, 4.6rem);
        }

        .panel:hover .lang-name {
            transform: translateY(-4px);
        }

        .lang-sub {
            margin-top: 0.9rem;
            font-size: 13px;
            color: var(--text-dim);
            font-family: 'Inter', sans-serif;
        }

        .play-cue {
            margin-top: 2rem;
            width: 46px;
            height: 46px;
            margin-left: auto;
            margin-right: auto;
            border: 1px solid var(--line-strong);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.6;
            transition: opacity 0.3s ease, border-color 0.3s ease, transform 0.3s ease;
        }

        .panel:hover .play-cue {
            opacity: 1;
            transform: scale(1.08);
        }

        .panel-th:hover .play-cue {
            border-color: var(--th);
        }

        .panel-en:hover .play-cue {
            border-color: var(--en);
        }

        .play-cue svg {
            width: 14px;
            height: 14px;
            fill: var(--text);
        }

        /* film-strip divider */
        .divider {
            width: 34px;
            flex-shrink: 0;
            background: var(--bg);
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-evenly;
            padding: 1rem 0;
        }

        .sprocket {
            width: 9px;
            height: 9px;
            border-radius: 2px;
            background: rgba(242, 239, 231, 0.16);
        }

        .beam {
            position: absolute;
            left: 50%;
            top: -10%;
            width: 2px;
            height: 40%;
            background: linear-gradient(180deg, transparent, var(--gold), transparent);
            transform: translateX(-50%);
            opacity: 0;
            animation: sweep 5s ease-in-out infinite;
        }

        @keyframes sweep {
            0% {
                top: -10%;
                opacity: 0;
            }

            8% {
                opacity: 0.9;
            }

            45% {
                top: 70%;
                opacity: 0.9;
            }

            55% {
                opacity: 0;
            }

            100% {
                top: 70%;
                opacity: 0;
            }
        }

        .footnote {
            text-align: center;
            padding: 1.2rem 1rem clamp(1.4rem, 3vh, 2rem);
            font-size: 12px;
            color: var(--text-dim);
            font-family: 'Inter', sans-serif;
            letter-spacing: 0.02em;
        }

        @media (max-width: 640px) {
            .panels {
                flex-direction: column;
            }

            .divider {
                width: 100%;
                height: 24px;
                flex-direction: row;
            }

            .panel:hover {
                flex: 1;
            }

            .panel-inner {
                padding: 1rem;
            }

            .lang-mark {
                margin-bottom: 0.5rem;
            }

            .lang-sub {
                margin-top: 0.5rem;
                font-size: 12px;
            }

            .play-cue {
                margin-top: 1rem;
                width: 38px;
                height: 38px;
            }

            .footnote {
                padding: 0.75rem 1rem 1.25rem;
                font-size: 11px;
            }
        }

        /* short / landscape screens: shrink header so panels stay usable */
        @media (max-height: 480px) {
            .header {
                padding: clamp(3rem, 18vh, 3.5rem) 1rem 0.5rem;
            }

            .title-en {
                display: none;
            }

            .lang-name {
                font-size: clamp(1.8rem, 6vh, 3rem) !important;
            }

            .play-cue {
                display: none;
            }

            .footnote {
                padding: 0.4rem 1rem 0.6rem;
            }

            .brand-logo {
                height: clamp(36px, 8vh, 56px);
            }
        }

        /* ---------- Player screen ---------- */
        .player {
            position: absolute;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .player.active {
            opacity: 1;
            pointer-events: auto;
        }

        .player video,
        .player iframe {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
            border: 0;
        }

        .back-btn {
            position: absolute;
            top: max(1rem, env(safe-area-inset-top));
            left: max(1rem, env(safe-area-inset-left));
            z-index: 5;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(18, 17, 16, 0.7);
            border: 1px solid var(--line);
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: clamp(12px, 3vw, 13px);
            letter-spacing: 0.03em;
            padding: clamp(6px, 1.5vw, 8px) clamp(12px, 3vw, 16px);
            border-radius: 999px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: border-color 0.2s ease, background 0.2s ease;
        }

        .brand-logo {
            position: absolute;
            top: max(16px, env(safe-area-inset-top));
            left: max(16px, env(safe-area-inset-left));
            height: clamp(48px, 10vw, 100px);
            width: auto;
            z-index: 10;
            object-fit: contain;
            border-radius: 12px;
        }

        .back-btn:hover {
            border-color: var(--gold-dim);
            background: rgba(18, 17, 16, 0.9);
        }

        .back-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }
    </style>
</head>

<body>

    <div class="stage">


        <div class="selector" id="selector">
            <img src="img/logo.png" alt="Logo" class="brand-logo">
            <div class="header">
                <span class="eyebrow">Two languages, one story</span>
                <div class="title-th">Select the version you wish to watch.</div>
                <div class="title-en">choose the version you'd like to watch</div>
            </div>

            <div class="panels">
                <div class="panel panel-th" id="panel-th" tabindex="0" role="button" aria-label="ดูคลิปเวอร์ชันภาษาไทย">
                    <div class="panel-inner">
                        <span class="lang-mark">Version</span>
                        <div class="lang-name">Thai</div>
                        <div class="lang-sub">Thai Voice-Over</div>
                        <div class="play-cue" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                        </div>
                    </div>
                </div>

                <div class="divider" aria-hidden="true">
                    <div class="beam"></div>
                    <div class="sprocket"></div>
                    <div class="sprocket"></div>
                    <div class="sprocket"></div>
                    <div class="sprocket"></div>
                    <div class="sprocket"></div>
                    <div class="sprocket"></div>
                </div>

                <div class="panel panel-en" id="panel-en" tabindex="0" role="button"
                    aria-label="Watch the English version">
                    <div class="panel-inner">
                        <span class="lang-mark">Version</span>
                        <div class="lang-name">English</div>
                        <div class="lang-sub">English dub / subtitles</div>
                        <div class="play-cue" aria-hidden="true">
                            <svg viewBox="0 0 24 24">
                                <path d="M8 5v14l11-7z" />
                            </svg>
                        </div>
                    </div>
                </div>
            </div>

            <div class="footnote">คลิกฝั่งที่ต้องการเพื่อเริ่มดู &nbsp;·&nbsp; click a side to start watching</div>
        </div>

        <div class="player" id="player">
            <button class="back-btn" id="back-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20z" />
                </svg>
                <span id="back-label">กลับไปเลือกภาษา</span>
            </button>
            <div id="video-wrap" style="width:100%; height:100%;"></div>
        </div>

    </div>

    <script>
        // ตรงนี้ให้แก้ path/ลิงก์เป็นไฟล์คลิปจริงของคุณ
        // Replace these with your actual video files or share links.
        //
        // รองรับ 2 แบบ:
        // 1) ไฟล์วิดีโอที่วางไว้ในโฟลเดอร์เดียวกัน เช่น "video/Version-Thai.mp4"
        // 2) ลิงก์แชร์ Google Drive แบบที่ก็อปมาได้เลย เช่น
        //    "https://drive.google.com/file/d/XXXXXXXXXXXX/view?usp=sharing"
        //    (โค้ดจะดึง FILE ID ออกมาแปลงเป็นลิงก์ embed ให้เอง)
        const SOURCES = {
            th: "https://drive.google.com/file/d/1Ybt60pJfDUF7BQBf8m4F0CUeDWuaY5S7/view?usp=sharing",
            en: "https://drive.google.com/file/d/18GB_D41WJ1Yu9-eccA-o5Snp5R85YiX8/view?usp=sharing"
        };

        const selector = document.getElementById('selector');
        const player = document.getElementById('player');
        const videoWrap = document.getElementById('video-wrap');
        const backBtn = document.getElementById('back-btn');
        const backLabel = document.getElementById('back-label');

        function extractDriveId(url) {
            const match = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/[?&]id=([a-zA-Z0-9_-]+)/);
            return match ? match[1] : null;
        }

        function playVersion(lang) {
            const src = SOURCES[lang];
            videoWrap.innerHTML = "";

            const driveId = extractDriveId(src);

            if (driveId) {
                // Google Drive share link -> embed player (works reliably for streaming)
                const iframe = document.createElement('iframe');
                iframe.src = `https://drive.google.com/file/d/${driveId}/preview`;
                iframe.allow = "autoplay";
                iframe.allowFullscreen = true;
                videoWrap.appendChild(iframe);
            } else {
                // Local/direct video file
                const video = document.createElement('video');
                video.src = src;
                video.controls = true;
                video.setAttribute('playsinline', '');
                video.autoplay = true;
                videoWrap.appendChild(video);
            }

            selector.classList.add('hidden');
            player.classList.add('active');
            backLabel.textContent = lang === 'th' ? 'กลับไปเลือกภาษา' : 'Back to language selection';
        }

        function goBack() {
            videoWrap.innerHTML = "";
            player.classList.remove('active');
            selector.classList.remove('hidden');
        }

        document.getElementById('panel-th').addEventListener('click', () => playVersion('th'));
        document.getElementById('panel-en').addEventListener('click', () => playVersion('en'));

        [document.getElementById('panel-th'), document.getElementById('panel-en')].forEach(el => {
            el.addEventListener('keydown', e => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    el.click();
                }
            });
        });

        backBtn.addEventListener('click', goBack);
    </script>

</body>

</html>
